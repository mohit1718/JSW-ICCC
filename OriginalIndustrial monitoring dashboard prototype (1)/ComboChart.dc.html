<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%">
  <svg viewBox="{{ chart.vb }}" width="100%" preserveAspectRatio="none" style="{{ chart.svgStyle }}">
    <sc-for list="{{ chart.grid }}" as="g" hint-placeholder-count="5">
      <line x1="{{ g.x1 }}" y1="{{ g.y }}" x2="{{ g.x2 }}" y2="{{ g.y }}" stroke="#d8d2c6" stroke-width="1" vector-effect="non-scaling-stroke"></line>
    </sc-for>
    <sc-for list="{{ chart.bars }}" as="b" hint-placeholder-count="7">
      <rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" fill="{{ b.fill }}" rx="2"></rect>
    </sc-for>
    <sc-for list="{{ chart.ticks }}" as="t" hint-placeholder-count="7">
      <line x1="{{ t.x1 }}" y1="{{ t.y }}" x2="{{ t.x2 }}" y2="{{ t.y }}" stroke="#2e2c27" stroke-width="2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"></line>
    </sc-for>
    <path d="{{ chart.lineD }}" fill="none" stroke="{{ chart.lineColor }}" stroke-width="2" vector-effect="non-scaling-stroke"></path>
  </svg>
  <sc-for list="{{ chart.labels }}" as="l" hint-placeholder-count="12">
    <div style="{{ l.style }}">{{ l.label }}</div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:240},&quot;chart&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{vb:string,svgStyle:object,grid:any[],bars:any[],ticks:any[],lineD:string,lineColor:string,labels:any[]}&quot;}}"></script>
</body>
</html>
