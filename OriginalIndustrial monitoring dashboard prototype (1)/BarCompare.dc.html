<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-2bf3dc51-5e9f-4c8d-a54d-4a4b6618fb4a/styles.css">
<script src="_ds/nocturne-2bf3dc51-5e9f-4c8d-a54d-4a4b6618fb4a/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:7px;width:100%">
  <sc-for list="{{ bars }}" as="b" hint-placeholder-count="5">
    <div style="display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:10px">
      <span style="font-size:11.5px;color:#2e2c27;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ b.label }}</span>
      <div style="position:relative;height:15px;border-radius:3px;background:#fbf9f5;box-shadow:inset 0 0 0 1px #d8d2c6">
        <div style="{{ b.fillStyle }}"></div>
        <div style="{{ b.targetStyle }}"></div>
      </div>
      <span style="font-size:11.5px;color:#1b1a17;text-align:right;font-variant-numeric:tabular-nums;min-width:78px">{{ b.display }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:180},&quot;bars&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;}}"></script>
</body>
</html>
